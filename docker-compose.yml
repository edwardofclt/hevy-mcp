services:
  hevy-mcp:
    build: .
    image: hevy-mcp:local
    restart: unless-stopped
    ports:
      - "${HEVY_MCP_PORT:-3000}:3000"
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:?APPLE_TEAM_ID is required}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:?APPLE_CLIENT_ID is required}
      APPLE_KEY_ID: ${APPLE_KEY_ID:?APPLE_KEY_ID is required}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:?APPLE_PRIVATE_KEY is required}
      APPLE_REDIRECT_URI: ${APPLE_REDIRECT_URI:?APPLE_REDIRECT_URI is required}
      DATABASE_PATH: /data/hevy-mcp.sqlite
    volumes:
      - hevy_mcp_data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  hevy_mcp_data:
